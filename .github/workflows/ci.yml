name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Assert the core module has no dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "the core go.mod must not declare external dependencies"
            exit 1
          fi
      - run: go test ./... -count=1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum
      - run: go -C integration build ./...
      - run: go -C integration vet ./...
      - run: go -C integration test ./... -count=1

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/flyway/go.mod
          cache-dependency-path: cmd/flyway/go.sum
      - run: go -C cmd/flyway build ./...
      - run: go -C cmd/flyway vet ./...

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: example/go.mod
          cache-dependency-path: example/go.sum
      - run: go -C example build ./...
